name: Deploy GalleryGo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'gallerygo-demo/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Verify the demo
        run: |
          node --version
          node --test gallerygo-demo/tests/*.test.cjs
          node --check gallerygo-demo/script.js
          node --check gallerygo-demo/sw.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare the static website
        run: |
          mkdir -p _site
          cp gallerygo-demo/index.html gallerygo-demo/style.css gallerygo-demo/script.js gallerygo-demo/data.json gallerygo-demo/sw.js _site/
          cp -R gallerygo-demo/images _site/images
          touch _site/.nojekyll

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
